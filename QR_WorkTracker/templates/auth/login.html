<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Log in | WorkTracker</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
		<div class="card shadow-sm border-0 w-100" style="max-width: 420px;">
			<div class="card-body p-4 p-md-5">
				<h1 class="h2 mb-2">Welcome back</h1>
				<p class="text-secondary mb-4">Log in to continue to WorkTracker.</p>

				{% if form.errors %}
					<div class="alert alert-danger" role="alert">Please check your username and password and try again.</div>
				{% endif %}

				<form method="post" action="{% url 'login' %}">
					{% csrf_token %}
					<div class="mb-3">
						<label for="id_username" class="form-label">Username</label>
						<input id="id_username" name="username" type="text" class="form-control" autocomplete="username" required autofocus>
					</div>

					<div class="mb-3">
						<label for="id_password" class="form-label">Password</label>
						<input id="id_password" name="password" type="password" class="form-control" autocomplete="current-password" required>
					</div>

					{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
					<button type="submit" class="btn btn-primary w-100">Log in</button>
				</form>
			</div>
		</div>
	</main>
</body>
</html>
