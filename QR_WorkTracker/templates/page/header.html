<header class="site-header text-white">
    <div class="container py-5">
        <div class="row align-items-end g-4">
            <div class="col-lg-8">
                <div class="header-eyebrow text-uppercase fw-bold mb-2">Evidence pracovní doby</div>
                <h1 class="display-4 fw-bold mb-3">QR WorkTracker</h1>
            </div>
            <div class="col-lg-4 text-lg-end">
                {% if user.is_authenticated %}
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-lg btn-outline-light">Odhlásit se</button>
                    </form>
                {% else %}
                    <a class="btn btn-lg btn-outline-light" href="{% url 'login' %}">Přihlásit se</a>
                {% endif %}
            </div>
        </div>
    </div>
</header>
